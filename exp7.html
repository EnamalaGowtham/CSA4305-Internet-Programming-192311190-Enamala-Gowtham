<!DOCTYPE html>
<html>
<head>
    <title>Number Greater than 1000 & Divisible by 99</title>
</head>
<body>

<h2>Find Number Greater than 1000 & Divisible by 99</h2>
<button onclick="findNumber()">Find Number</button>

<p id="result"></p>

<script>
function findNumber() {
    let num = 1001;

    while (num % 99 !== 0) {
        num++;
    }

    document.getElementById("result").innerHTML =
        "The first number greater than 1000 divisible by 99 is: " + num;
}
</script>

</body>
</html>
