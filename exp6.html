<!DOCTYPE html>
<html>
<head>
    <title>Multiples of 7</title>
</head>
<body>

<h2>Multiples of 7 (1 to 10)</h2>
<button onclick="showMultiples()">Display</button>

<p id="result"></p>

<script>
function showMultiples() {
    let output = "";

    for (let i = 1; i <= 10; i++) {
        output += (7 * i) + "<br>";
    }

    document.getElementById("result").innerHTML = output;
}
</script>

</body>
</html>
