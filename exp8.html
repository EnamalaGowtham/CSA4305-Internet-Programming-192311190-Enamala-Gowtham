<!DOCTYPE html>
<html>
<head>
    <title>User Defined Function</title>
</head>
<body>

<h2>User Defined Function Example</h2>

<button onclick="displaySum()">Find Sum</button>

<p id="result"></p>

<script>
    // User-defined function
    function add(a, b) {
        return a + b;
    }

    function displaySum() {
        let num1 = 20;
        let num2 = 30;
        let sum = add(num1, num2);

        document.getElementById("result").innerHTML =
            "Sum = " + sum;
    }
</script>

</body>
</html>
